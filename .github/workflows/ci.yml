name: CI/CD Pipeline

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [16.x, 18.x, 20.x]

        services:
            mongodb:
                image: mongo:6
                ports:
                    - 27017:27017

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run linter
              run: npm run lint

            - name: Check code formatting
              run: npm run format:check

            - name: Run tests
              run: npm test
              env:
                  NODE_ENV: test
                  MONGODB_URI: mongodb://localhost:27017/calviora_test
                  EXPRESS_SESSION_SECRET: test-secret-key
                  JWT_SECRET: test-jwt-secret

            - name: Run security audit
              run: npm audit --audit-level=high

    build:
        needs: test
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/main'

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build Docker image
              run: docker build -t calviora:latest .

            - name: Test Docker image
              run: |
                  docker run -d --name test-container -p 3000:3000 \
                    -e MONGODB_URI=mongodb://host.docker.internal:27017/calviora \
                    -e EXPRESS_SESSION_SECRET=test-secret \
                    -e JWT_SECRET=test-jwt-secret \
                    calviora:latest
                  sleep 10
                  curl -f http://localhost:3000/health || exit 1
                  docker stop test-container
                  docker rm test-container

    security:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Run Trivy vulnerability scanner
              uses: aquasecurity/trivy-action@master
              with:
                  scan-type: 'fs'
                  scan-ref: '.'
                  format: 'sarif'
                  output: 'trivy-results.sarif'

            - name: Upload Trivy scan results to GitHub Security tab
              uses: github/codeql-action/upload-sarif@v2
              if: always()
              with:
                  sarif_file: 'trivy-results.sarif'
